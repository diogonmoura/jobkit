# Daily bridge between your data repo and the hosted tracker (web/), run by GitHub Actions.
# Copy to .github/workflows/jobkit-daily.yml in your private data repo, set [tracker] backend = "web"
# and supabase_url in jobkit.toml, and add the SUPABASE_SECRET_KEY repository secret.
# It runs before the web app's 07:00 UTC scan, which then scores the postings this sends.
name: jobkit daily

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobkit-daily
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # Each machine keeps its own sync snapshot next to applications.md; this names the Action's.
      JOBKIT_MACHINE: github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get jobkit
        run: git clone --depth 1 https://github.com/diogonmoura/jobkit.git "$RUNNER_TEMP/jobkit"
      - name: Send postings from boards the web app can't read
        run: python3 "$RUNNER_TEMP/jobkit/jobkit/cli.py" watch push-postings
      - name: Sync applications.md with the web app
        run: python3 "$RUNNER_TEMP/jobkit/jobkit/cli.py" sync web
      # applications.md and the Action's snapshot go in one commit: if it never lands, both stay old
      # together and the next run still sees web edits as edits. -f because .jobkit-*.json is often ignored.
      - name: Commit applications.md and the sync snapshot
        run: |
          git add -f applications.md .jobkit-web-sync-github-actions.json
          if ! git diff --cached --quiet; then
            git config user.name "jobkit-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync applications.md with the web app"
            git push
          fi
