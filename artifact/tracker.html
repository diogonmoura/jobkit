<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Application Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header with a view switch; Applications view = summary strip, follow-ups, dense table with expandable rows; Following view = watch summary, then the companies being followed for new roles. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1b2230; --muted:#667085; --line:#dde1e8;
  --accent:#1f5f8b; --accent-fg:#ffffff;
  --good:#1d7a4d; --good-bg:#e3f3ea; --warn:#9a5b00; --warn-bg:#fdf0d9; --bad:#a63a3a; --bad-bg:#f8e4e4;
  --prog:#1f5f8b; --prog-bg:#e2eef7; --idle:#667085; --idle-bg:#eceef2;
  --font:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --fg:#e6e9ef; --muted:#9aa3b2; --line:#2b3340;
  --accent:#6fb1e0; --accent-fg:#0d1722;
  --good:#6cd19b; --good-bg:#17301f; --warn:#f0b45a; --warn-bg:#35280f; --bad:#ef8b8b; --bad-bg:#3a1c1c;
  --prog:#6fb1e0; --prog-bg:#16293a; --idle:#9aa3b2; --idle-bg:#252c37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --fg:#e6e9ef; --muted:#9aa3b2; --line:#2b3340;
  --accent:#6fb1e0; --accent-fg:#0d1722;
  --good:#6cd19b; --good-bg:#17301f; --warn:#f0b45a; --warn-bg:#35280f; --bad:#ef8b8b; --bad-bg:#3a1c1c;
  --prog:#6fb1e0; --prog-bg:#16293a; --idle:#9aa3b2; --idle-bg:#252c37; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.view{display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.titlebox{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.asof{font-family:var(--mono);font-size:12px;color:var(--muted)}
h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
/* view switch: one segmented control, the selected segment filled with the accent */
.switch{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:3px;gap:3px}
.switch button{font:inherit;font-size:13px;font-weight:500;border:0;background:transparent;color:var(--muted);border-radius:5px;padding:6px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline}
.switch button:hover{color:var(--fg)}
.switch button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
.switch .n{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;opacity:.8}
@media (max-width:480px){.switch{width:100%}.switch button{flex:1;justify-content:center}}
@media (prefers-reduced-motion:no-preference){.switch button{transition:background-color .15s,color .15s}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert b{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.follow{list-style:none;margin:0;padding:0}
.follow li{display:flex;gap:12px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.follow li:first-child{border-top:0}
.follow .co{font-weight:600}
.follow .meta{font-family:var(--mono);font-size:12px;color:var(--warn)}
.empty{padding:16px 14px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button,input,select{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:5px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td.co b{font-weight:600}
td.co small{display:block;color:var(--muted);font-size:12px}
.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:500;border-radius:4px;padding:2px 8px}
.s-applied,.s-withdrawn,.s-ghosted{background:var(--idle-bg);color:var(--idle)}
.s-ack,.s-screening,.s-interview{background:var(--prog-bg);color:var(--prog)}
.s-offer{background:var(--good-bg);color:var(--good)}
.s-rejected{background:var(--bad-bg);color:var(--bad)}
.stale{color:var(--warn);font-weight:500}
tr.detail td{background:color-mix(in srgb,var(--fg) 3%,transparent);padding:12px 14px 16px}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:640px){.detail-grid{grid-template-columns:minmax(0,1fr)}}
.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.events li{display:flex;gap:10px}
.events .d{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.events .t{min-width:0;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:6px 8px;min-width:0;width:100%}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline input{flex:1;min-width:160px}
a{color:var(--accent)}
#addform{padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
#addform .field{margin:0}
.watch{list-style:none;margin:0;padding:0}
.watch li{display:grid;grid-template-columns:minmax(0,1.4fr) auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line)}
.watch li:first-child{border-top:0}
.watch .co{font-weight:600;min-width:0;overflow-wrap:anywhere}
.watch .board{font-size:12px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.watch .note{grid-column:1/-1;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
@media (max-width:560px){.watch li{grid-template-columns:minmax(0,1fr) auto}.watch .board,.watch .num{grid-column:auto}}
.w-watching{background:var(--good-bg);color:var(--good)}
.w-pending{background:var(--prog-bg);color:var(--prog)}
.w-failing{background:var(--bad-bg);color:var(--bad)}
.w-unsupported{background:var(--idle-bg);color:var(--idle)}
.sub{font-size:12px;color:var(--muted);margin:-4px 0 8px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;max-width:90vw}
</style>

<div class="wrap">
  <header>
    <div class="titlebox">
      <h1>Application Tracker</h1>
      <div class="asof" id="asof"></div>
    </div>
    <div class="switch" role="tablist" aria-label="View">
      <button type="button" role="tab" id="tab-applications" aria-controls="view-applications" aria-selected="true">Applications <span class="n" id="n-applications"></span></button>
      <button type="button" role="tab" id="tab-following" aria-controls="view-following" aria-selected="false" tabindex="-1">Following <span class="n" id="n-following"></span></button>
    </div>
  </header>

  <div class="view" id="view-applications" role="tabpanel" aria-labelledby="tab-applications">
    <section class="stats" id="stats" aria-label="Summary"></section>

    <section>
      <h2>Needs follow-up</h2>
      <div class="panel"><ul class="follow" id="follow"></ul></div>
    </section>

    <section>
      <div class="bar" style="margin-bottom:10px">
        <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
        <button class="btn ghost" id="addtoggle" type="button" aria-expanded="false">Add application</button>
      </div>
      <form class="panel" id="addform" hidden>
        <div class="field"><label for="f-company">Company</label><input id="f-company" required></div>
        <div class="field"><label for="f-role">Role</label><input id="f-role" required></div>
        <div class="field"><label for="f-cv">CV file</label><input id="f-cv" placeholder="cv_company"></div>
        <div class="field"><label for="f-posting">Posting URL</label><input id="f-posting" type="url" placeholder="https://"></div>
        <div class="field"><button class="btn" type="submit">Save application</button></div>
      </form>
      <div class="panel tablewrap">
        <table>
          <thead><tr><th>Company</th><th>Status</th><th>Applied</th><th>Last contact</th><th>Quiet</th><th>CV</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="view" id="view-following" role="tabpanel" aria-labelledby="tab-following" hidden>
    <section class="stats" id="wstats" aria-label="Following summary"></section>
    <section>
      <h2>Following</h2>
      <p class="sub" id="followsub">Companies you applied to with a posting link. New matching roles are reported after each morning's check.</p>
      <div class="panel"><ul class="watch" id="watching"></ul></div>
    </section>
  </div>
</div>
<div id="toast" hidden role="status"></div>

<script>
const STATUSES=["applied","ack","screening","interview","offer","rejected","withdrawn","ghosted"];
const ACTIVE=["applied","ack","screening","interview","offer"];
const HEARD=["ack","screening","interview","offer","rejected"];
const VIEWS=["applications","following"];
const todayISO=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
const daysSince=d=>Math.max(0,Math.round((new Date(todayISO())-new Date(d))/864e5));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let following=null, db=null, apps=[], filter="all", openId=null, connected=false;
const queue=new Map();

function initialView(){
  const h=(location.hash||"").slice(1);
  if(VIEWS.includes(h))return h;
  try{const v=localStorage.getItem("tracker-view");if(VIEWS.includes(v))return v}catch(_){}
  return "applications";
}
let view=initialView();
function setView(v,focus){
  if(!VIEWS.includes(v))return;
  view=v;
  VIEWS.forEach(name=>{
    const on=name===v,tab=$("tab-"+name);
    tab.setAttribute("aria-selected",String(on));tab.tabIndex=on?0:-1;
    $("view-"+name).hidden=!on;
  });
  if(focus)$("tab-"+v).focus();
  try{localStorage.setItem("tracker-view",v)}catch(_){}
  try{history.replaceState(null,"","#"+v)}catch(_){}
}

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)}

function isStale(a){
  const q=daysSince(a.last||a.applied);
  if(a.status==="applied")return q>14;
  if(["ack","screening","interview"].includes(a.status))return q>10;
  return false;
}

const WLABEL={watching:"watching",pending:"first check pending",failing:"check failing",unsupported:"not watchable"};
const WORDER={failing:0,watching:1,pending:2,unsupported:3};
function renderFollowing(){
  const rows=(following&&following.companies)||[];
  const live=rows.filter(w=>w.status!=="unsupported");
  $("n-following").textContent=rows.length?live.length:"";
  const count=s=>rows.filter(w=>w.status===s).length;
  const roles=live.reduce((n,w)=>n+(Number(w.tracked)||0),0);
  const failing=count("failing");
  $("wstats").innerHTML=[
    [count("watching"),"Watching",""],
    [count("pending"),"First check pending",""],
    [failing,"Check failing",failing?"alert":""],
    [count("unsupported"),"Not watchable",""],
    [roles,"Open roles seen",""]
  ].map(([n,l,c])=>`<div class="stat ${c}"><b>${n}</b><span>${l}</span></div>`).join("");
  if(following&&following.updated)$("followsub").textContent="Companies you applied to with a posting link. New matching roles are reported after each morning's check. Updated "+following.updated+".";
  if(!rows.length){
    $("watching").innerHTML=`<li class="empty" style="display:block">${connected?"No companies followed yet. Add an application with its posting link and it is followed at the next sync.":"Connecting to the tracker database."}</li>`;
    return;
  }
  const list=[...rows].sort((a,b)=>(WORDER[a.status]??9)-(WORDER[b.status]??9)||a.company.localeCompare(b.company));
  $("watching").innerHTML=list.map(w=>{
    const right=w.status==="unsupported"?"":(w.last_check?"checked "+esc(w.last_check):"not checked yet");
    const count=w.status==="unsupported"?"":esc(w.tracked)+" roles seen";
    const note=(w.status==="unsupported"||w.status==="failing")&&w.note?`<span class="note">${esc(w.note)}</span>`:"";
    return `<li><span class="co">${esc(w.company)}</span><span class="pill w-${esc(w.status)}">${WLABEL[w.status]||esc(w.status)}</span>
      <span class="board">${esc(w.board||"")}${count?" · "+count:""}</span><span class="num">${right}</span>${note}</li>`;
  }).join("");
}

function render(){
  $("asof").textContent=todayISO();
  renderFollowing();
  $("n-applications").textContent=apps.length||"";
  const active=apps.filter(a=>ACTIVE.includes(a.status));
  const decided=apps.filter(a=>a.status!=="withdrawn");
  const heard=decided.filter(a=>HEARD.includes(a.status)).length;
  const rate=decided.length?Math.round(100*heard/decided.length):0;
  const stale=apps.filter(isStale).sort((a,b)=>daysSince(b.last)-daysSince(a.last));
  $("stats").innerHTML=[
    [active.length,"Active"],
    [apps.filter(a=>a.status==="interview").length,"In interview"],
    [rate+"%","Heard back ("+heard+" of "+decided.length+")"],
    [stale.length,"Gone quiet"]
  ].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");

  $("follow").innerHTML=stale.length
    ? stale.map(a=>`<li><span class="co">${esc(a.company)}</span><span>${esc(a.role)}</span><span class="meta">${a.status}, ${daysSince(a.last||a.applied)} days quiet</span></li>`).join("")
    : `<li class="empty">${apps.length?"Nothing has gone quiet.":"No applications loaded yet."}</li>`;

  const counts={all:apps.length};STATUSES.forEach(s=>counts[s]=apps.filter(a=>a.status===s).length);
  $("chips").innerHTML=["all",...STATUSES].filter(s=>s==="all"||counts[s]).map(s=>
    `<button type="button" class="chip" data-f="${s}" aria-pressed="${filter===s}">${s} ${counts[s]}</button>`).join("");

  const list=apps.filter(a=>filter==="all"||a.status===filter)
    .sort((a,b)=>(b.last||"").localeCompare(a.last||"")||a.company.localeCompare(b.company));
  if(!list.length){
    $("rows").innerHTML=`<tr><td colspan="6" class="empty">${connected?(apps.length?"No applications with this status.":"No applications yet. Add the first one, or ask Claude to sync applications.md."):"Connecting to the tracker database."}</td></tr>`;
    return;
  }
  $("rows").innerHTML=list.map(a=>{
    const q=daysSince(a.last||a.applied), st=isStale(a);
    let h=`<tr class="row" data-id="${a.id}"><td class="co"><b>${esc(a.company)}</b><small>${esc(a.role)}</small></td>
      <td><span class="pill s-${a.status}">${a.status}</span></td>
      <td class="num">${esc(a.applied)}</td><td class="num">${esc(a.last||"")}</td>
      <td class="num ${st?"stale":""}">${q}d</td><td class="num">${esc(a.cv||"")}</td></tr>`;
    if(openId===a.id){
      const ev=[...(a.events||[])].sort((x,y)=>y.d.localeCompare(x.d));
      h+=`<tr class="detail"><td colspan="6"><div class="detail-grid">
        <div><h2>History</h2><ul class="events">${ev.length?ev.map(e=>`<li><span class="d">${esc(e.d)}</span><span class="t">${esc(e.t)}</span></li>`).join(""):'<li class="t" style="color:var(--muted)">No events logged.</li>'}</ul>
          ${a.posting?`<p style="margin:12px 0 0"><a href="${esc(a.posting)}" target="_blank" rel="noopener">Job posting</a></p>`:""}</div>
        <div>
          <div class="field"><label for="st-${a.id}">Status</label>
            <select id="st-${a.id}" data-status="${a.id}">${STATUSES.map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select></div>
          <div class="field"><label for="ev-${a.id}">Log an event</label>
            <div class="inline"><input id="ev-${a.id}" placeholder="Recruiter call booked for Thursday"><button class="btn" type="button" data-log="${a.id}">Log</button></div></div>
        </div></div></td></tr>`;
    }
    return h;
  }).join("");
}

function write(id,fn){
  // one write at a time per document
  const prev=queue.get(id)||Promise.resolve();
  const next=prev.then(fn).catch(e=>toast("Save failed: "+(e&&e.message||e)));
  queue.set(id,next);return next;
}
function withEvent(a,text,extra={}){
  const d=todayISO();
  const last=(a.last&&a.last>d)?a.last:d;
  return {...extra,last,events:[...(a.events||[]),{d,t:text}]};
}
async function setStatus(id,status){
  const a=apps.find(x=>x.id===id);if(!a||a.status===status||!db)return;
  await write(id,()=>db.doc("apps/"+id).update(withEvent(a,"status: "+status,{status})));
}
async function logEvent(id){
  const a=apps.find(x=>x.id===id),inp=$("ev-"+id);const text=inp&&inp.value.trim();
  if(!a||!text||!db)return;
  await write(id,()=>db.doc("apps/"+id).update(withEvent(a,text)));
  inp.value="";
}

document.addEventListener("click",e=>{
  const tab=e.target.closest('[role="tab"]');if(tab){setView(tab.id.slice(4));return}
  const chip=e.target.closest("[data-f]");if(chip){filter=chip.dataset.f;render();return}
  const log=e.target.closest("[data-log]");if(log){logEvent(log.dataset.log);return}
  if(e.target.closest("a,select,input"))return;
  const row=e.target.closest("tr.row");if(row){openId=openId===row.dataset.id?null:row.dataset.id;render()}
});
document.addEventListener("change",e=>{const s=e.target.closest("[data-status]");if(s)setStatus(s.dataset.status,s.value)});
document.addEventListener("keydown",e=>{
  if(e.target.getAttribute&&e.target.getAttribute("role")==="tab"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")){
    e.preventDefault();const i=VIEWS.indexOf(view);setView(VIEWS[(i+(e.key==="ArrowRight"?1:VIEWS.length-1))%VIEWS.length],true);return}
  if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("ev-")){e.preventDefault();logEvent(e.target.id.slice(3))}
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==view)setView(h)});

$("addtoggle").addEventListener("click",()=>{const f=$("addform");f.hidden=!f.hidden;$("addtoggle").setAttribute("aria-expanded",String(!f.hidden))});
$("addform").addEventListener("submit",async e=>{
  e.preventDefault();if(!db){toast("Database unavailable");return}
  const company=$("f-company").value.trim(),role=$("f-role").value.trim(),d=todayISO();
  const id=slug(company)+"-"+d;
  const body={company,role,applied:d,cv:$("f-cv").value.trim(),status:"applied",last:d,posting:$("f-posting").value.trim(),events:[]};
  await write(id,()=>db.doc("apps/"+id).set(body));
  e.target.reset();e.target.hidden=true;$("addtoggle").setAttribute("aria-expanded","false");toast(body.posting?"Saved "+company+". It will be followed for new roles at the next sync.":"Saved "+company);
});

setView(view);
render();
(async()=>{
  try{db=await (window.claude&&claude.use("db"))}catch(_){db=null}
  if(!db){connected=true;render();return}
  db.collection("apps").onSnapshot(s=>{
    connected=true;
    apps=s.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },err=>{connected=true;toast("Database error: "+err.code);render()});
  db.collection("following").onSnapshot(s=>{
    const doc=s.docs.find(d=>d.id==="all");
    following=doc?doc.data():null;
    renderFollowing();
  },()=>{});
})();
</script>

</body></html>
